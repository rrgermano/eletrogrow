upstream django {
    server unix:///var/www/eletrogrow/eletrogrow.sock;
    #server 127.0.0.1:8001;
}
server {
    listen 80;
    listen [::]:80;
    server_name intranet.eletrogrow.com.br;
    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name intranet.eletrogrow.com.br;
    ssl_certificate /etc/letsencrypt/live/intranet.eletrogrow.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intranet.eletrogrow.com.br/privkey.pem;
    charset     utf-8;
    client_max_body_size 75M;


    location /media  {
        alias /var/www/eletrogrow/media;
    }

    location /static {
        alias /var/www/eletrogrow/app/static;
    }

    location / {
        uwsgi_pass  django;
        include     /var/www/eletrogrow/uwsgi_params;
    }
}
