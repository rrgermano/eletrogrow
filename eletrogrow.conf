upstream django {
    server unix:///var/www/eletrogrow/eletrogrow.sock;
}

# Acesso via pitunnel (HTTP direto, sem redirect)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    charset utf-8;
    client_max_body_size 75M;

    location /media {
        alias /var/www/eletrogrow/media;
    }

    location /static {
        alias /var/www/eletrogrow/app/static;
    }

    location / {
        uwsgi_pass django;
        include /var/www/eletrogrow/uwsgi_params;
    }
}

# Acesso direto com HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name server.eletrogrow.com.br;

    ssl_certificate /etc/letsencrypt/live/server.eletrogrow.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.eletrogrow.com.br/privkey.pem;

    charset utf-8;
    client_max_body_size 75M;

    location /media {
        alias /var/www/eletrogrow/media;
    }

    location /static {
        alias /var/www/eletrogrow/app/static;
    }

    location / {
        uwsgi_pass django;
        include /var/www/eletrogrow/uwsgi_params;
    }
}